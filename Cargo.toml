[package]
name = "ccs"
version = "0.4.0"
edition = "2021"
description = "Claude Code Profile Switcher — launch Claude Code with named argument and environment profiles"
license = "MIT"
repository = "https://github.com/ptrdlr14/ccs"
readme = "README.md"

[[bin]]
name = "ccs"
path = "src/main.rs"

[dependencies]
clap = "4.5"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
